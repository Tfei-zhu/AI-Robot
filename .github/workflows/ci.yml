name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI 只运行固定模型/离线检查；真实模型评测须另行冻结累计金额并通过服务端预检。
env:
  PYTHON_DOTENV_DISABLED: "1"
  AIROBOT_LLM_API_KEY: ""
  AIROBOT_EMBEDDING_API_KEY: ""
  AIROBOT_GO_MULTI_AGENT_ENABLED: "false"
  AIROBOT_RERANK_ENABLED: "false"
  AIROBOT_CONTEXT_MODE: "off"
  LANGSMITH_TRACING: "false"
  LANGCHAIN_TRACING_V2: "false"

jobs:
  build:
    name: build（py_compile 语法门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装核心依赖
        run: pip install -r requirements-dev.txt
      - name: 语法检查
        run: python -m compileall -q app eval scripts tests

  test:
    name: test（离线单测 + 服务导入冒烟）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装核心依赖
        run: pip install -r requirements.txt
      - name: 离线单测（全量）
        run: |
          python tests/test_stability.py
          python tests/test_integration.py
          python tests/test_agent.py
          python tests/test_tracing.py
          python -m unittest discover -s tests -p "test_hardening.py" -v
          python eval/run_agent_eval.py
      - name: Go 契约及工作流离线验收
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests/test_go_contracts.py tests/test_go_workflow.py tests/test_go_runner.py tests/test_go_acceptance.py -q
      - name: 服务可导入冒烟
        run: python -c "from app.main import app; print('import OK, routes:', len(app.routes))"
      - name: 上下文机制与原业务回归
        run: python -m pytest tests -q

  go-validation:
    name: Go 实际沙箱与修复流程
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIROBOT_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: 构建固定 Go 验证镜像
        run: docker build -t airobot-go-validator:1.26.2 sandbox/go
      - name: 真实沙箱与工作流验收
        run: python -m pytest tests -q -ra --junitxml=test-results/go-sandbox.xml
      - name: 显式关闭多 Agent 后验证原流程和旧报告
        run: python scripts/check_multi_agent_rollback.py --output eval/reports/go/rollback
      - name: 固定输出对比评测（实际编译器）
        run: python eval/run_go_eval.py --fixtures
      - name: 上传对比报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-validation-fixture-report
          path: |
            eval/reports/go/
            test-results/go-sandbox.xml

  live-evaluation-policy:
    name: 真实评测未授权（不发送模型请求）
    runs-on: ubuntu-latest
    steps:
      - name: 保持真实模型评测关闭
        run: echo "NOT RUN：本工作流没有累计费用授权。真实评测须使用新冻结协议及 eval/run_multi_agent_eval.py 的费用/模型预检，不因配置 Secrets 自动启动。"
